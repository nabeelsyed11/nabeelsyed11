<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
    
    <defs>
        <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#22d3ee" />
            <stop offset="50%" stop-color="#a78bfa" />
            <stop offset="100%" stop-color="#f472b6" />
        </linearGradient>
        <clipPath id="circle-clip">
            <circle cx="50" cy="50" r="50" />
        </clipPath>
        <clipPath id="card-clip">
            <rect width="100%" height="100%" rx="16" />
        </clipPath>
    </defs>

    
    <style>
        .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .font-mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; }
        .bg { fill: #0d0e16; }
        .text-main { fill: #ffffff; }
        .text-muted { fill: #8b949e; }
        .border-aurora { stroke: url(#aurora); stroke-width: 1.5; }
        .card { fill: #0d0e16; stroke: #30363d; stroke-width: 1; rx: 12; }
    </style>

    
    <!-- Left Card: Browser -->
    <rect x="10" y="10" width="380" height="280" class="card" />
    <circle cx="30" cy="30" r="5" fill="#ff5f56" />
    <circle cx="45" cy="30" r="5" fill="#ffbd2e" />
    <circle cx="60" cy="30" r="5" fill="#27c93f" />
    <rect x="80" y="20" width="280" height="20" rx="10" fill="#161b22" />
    <text x="220" y="34" class="font-mono text-muted" font-size="10" text-anchor="middle">nabeelsyed11.dev</text>
    <line x1="10" y1="50" x2="390" y2="50" stroke="#30363d" stroke-width="1" />
    
    <text x="30" y="80" class="font-sans text-main" font-size="16" font-weight="bold">Core Capabilities</text>
    <g transform="translate(30, 100)">
        <rect width="340" height="45" rx="8" fill="#161b22" />
        <text x="15" y="27" class="font-sans text-main" font-size="14">⚡ PLC &amp; SCADA Automation</text>
    </g>
    <g transform="translate(30, 155)">
        <rect width="340" height="45" rx="8" fill="#161b22" />
        <text x="15" y="27" class="font-sans text-main" font-size="14">🤖 Artificial Intelligence</text>
    </g>
    <g transform="translate(30, 210)">
        <rect width="340" height="45" rx="8" fill="#161b22" />
        <text x="15" y="27" class="font-sans text-main" font-size="14">💻 Software Development</text>
    </g>

    <!-- Right Card: Carousel -->
    <rect x="410" y="10" width="380" height="280" class="card" />
    <text x="430" y="45" class="font-sans text-main" font-size="16" font-weight="bold">Currently Building at Technologics</text>
    
    <!-- Segment bars -->
    <rect x="430" y="60" width="100" height="4" rx="2" fill="#30363d" />
    <rect x="430" y="60" width="100" height="4" rx="2" fill="#22d3ee">
        <animate attributeName="width" values="0;100;100" dur="6s" repeatCount="indefinite" />
    </rect>
    <rect x="540" y="60" width="100" height="4" rx="2" fill="#30363d" />
    <rect x="540" y="60" width="100" height="4" rx="2" fill="#a78bfa">
        <animate attributeName="width" values="0;0;100;100" dur="6s" keyTimes="0;0.5;0.7;1" repeatCount="indefinite" />
    </rect>
    <rect x="650" y="60" width="100" height="4" rx="2" fill="#30363d" />
    <rect x="650" y="60" width="100" height="4" rx="2" fill="#f472b6">
        <animate attributeName="width" values="0;0;100;100" dur="6s" keyTimes="0;0.8;0.9;1" repeatCount="indefinite" />
    </rect>
    
    <g transform="translate(430, 90)">
        <text x="0" y="20" class="font-sans text-main" font-size="18" font-weight="bold" fill="url(#aurora)">Industrial Automation</text>
        <text x="0" y="45" class="font-sans text-muted" font-size="14">Working on advanced PLC logic,</text>
        <text x="0" y="65" class="font-sans text-muted" font-size="14">HMI interfaces, and SCADA systems</text>
        <text x="0" y="85" class="font-sans text-muted" font-size="14">to drive core manufacturing.</text>
    </g>
</svg>