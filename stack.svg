<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
    
    <defs>
        <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#22d3ee" />
            <stop offset="50%" stop-color="#a78bfa" />
            <stop offset="100%" stop-color="#f472b6" />
        </linearGradient>
        <clipPath id="circle-clip">
            <circle cx="50" cy="50" r="50" />
        </clipPath>
        <clipPath id="card-clip">
            <rect width="100%" height="100%" rx="16" />
        </clipPath>
    </defs>

    
    <style>
        .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .font-mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; }
        .bg { fill: #0d0e16; }
        .text-main { fill: #ffffff; }
        .text-muted { fill: #8b949e; }
        .border-aurora { stroke: url(#aurora); stroke-width: 1.5; }
        .card { fill: #0d0e16; stroke: #30363d; stroke-width: 1; rx: 12; }
    </style>

    <rect width="800" height="300" rx="16" class="bg border-aurora" />
    <g transform="translate(400, 150)">
        <!-- Core -->
        <circle cx="0" cy="0" r="15" fill="#22d3ee">
            <animate attributeName="r" values="15;18;15" dur="2s" repeatCount="indefinite" />
            <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite" />
        </circle>
        
        <!-- Orbits -->
        <ellipse cx="0" cy="0" rx="120" ry="40" fill="none" stroke="#30363d" stroke-width="1.5" transform="rotate(30)" />
        <ellipse cx="0" cy="0" rx="180" ry="60" fill="none" stroke="#30363d" stroke-width="1.5" transform="rotate(-30)" />
        <ellipse cx="0" cy="0" rx="250" ry="80" fill="none" stroke="#30363d" stroke-width="1.5" transform="rotate(10)" />
        
        <!-- Orbiting items -->
        <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite" />
            <g transform="translate(120, 0)">
                <circle cx="0" cy="0" r="12" fill="#161b22" stroke="#a78bfa" stroke-width="2"/>
                <text x="0" y="4" class="font-sans text-main" font-size="10" text-anchor="middle">AI</text>
            </g>
        </g>
        <g>
            <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="15s" repeatCount="indefinite" />
            <g transform="translate(180, 0)">
                <circle cx="0" cy="0" r="14" fill="#161b22" stroke="#f472b6" stroke-width="2"/>
                <text x="0" y="4" class="font-sans text-main" font-size="10" text-anchor="middle">PLC</text>
            </g>
        </g>
        <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
            <g transform="translate(250, 0)">
                <circle cx="0" cy="0" r="16" fill="#161b22" stroke="#22d3ee" stroke-width="2"/>
                <text x="0" y="4" class="font-sans text-main" font-size="10" text-anchor="middle">DEV</text>
            </g>
        </g>
    </g>
    
    <!-- Chip Grid -->
    <g transform="translate(30, 30)">
        <rect x="0" y="0" width="100" height="30" rx="15" fill="#161b22" stroke="#30363d" />
        <text x="50" y="19" class="font-sans text-main" font-size="12" text-anchor="middle">Python</text>
        
        <rect x="110" y="0" width="100" height="30" rx="15" fill="#161b22" stroke="#30363d" />
        <text x="160" y="19" class="font-sans text-main" font-size="12" text-anchor="middle">C++</text>
        
        <rect x="220" y="0" width="100" height="30" rx="15" fill="#161b22" stroke="#30363d" />
        <text x="270" y="19" class="font-sans text-main" font-size="12" text-anchor="middle">TensorFlow</text>
    </g>
</svg>